name: FM Pilot Linux validation
on:
  push:
    branches: [fm-sync/validation-pr08]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 1
      EXPECTED_HEAD: ca978e4e8ac5609750d857e9c9571c340ff0d709
      BASE_SHA: 742232942cff8742ee0350f8114d29919efacaad
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: lfs.fetchexclude
      GIT_CONFIG_VALUE_0: openpilot/selfdrive/modeld/models/big_driving_tinygrad.pkl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ca978e4e8ac5609750d857e9c9571c340ff0d709
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact Linux checkout and set up dependencies
        run: |
          test "$(uname -s)" = Linux
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git log -1 --format='%H %s'
          ./tools/op.sh setup
      - name: Ruff and Sunnylink recompilation
        shell: bash
        run: |
          git diff --check "$BASE_SHA...HEAD"
          mapfile -d '' -t files < <(git diff --name-only -z "$BASE_SHA...HEAD" -- '*.py')
          ruff check "${files[@]}"
          python openpilot/sunnypilot/sunnylink/tools/compile_settings_ui.py --out "$RUNNER_TEMP/settings_ui.json"
          python openpilot/sunnypilot/sunnylink/tools/compile_settings_ui.py --check
          cmp "$RUNNER_TEMP/settings_ui.json" openpilot/sunnypilot/sunnylink/settings_ui.json
      - name: Full SCons build
        run: scons -j"$(nproc)"
      - name: Sunnylink validator
        run: PYTHONPATH="$PWD" python openpilot/sunnypilot/sunnylink/tools/validate_settings_ui.py "$RUNNER_TEMP/settings_ui.json"
      - name: Affected unit tests
        run: |
          report="$RUNNER_TEMP/affected.xml"
          status=0
          ./tools/op.sh test -v --junitxml="$report" openpilot/sunnypilot/modeld_v2/tests openpilot/sunnypilot/system/tests openpilot/sunnypilot/sunnylink/tests openpilot/sunnypilot/models/tests/test_default_model.py openpilot/system/manager/test/test_manager.py || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then exit "$status"; fi
          python - "$report" "$status" <<'PY'
          import sys
          from xml.etree import ElementTree

          report, status = sys.argv[1:]
          documented = {
              ("test_default_model", "test_compare_onnx_hashes"),
              ("test_manager", "test_set_params_with_default_value"),
          }
          cases = list(ElementTree.parse(report).iter("testcase"))
          failures = [case for case in cases if case.find("failure") is not None]
          errors = [case for case in cases if case.find("error") is not None]
          skipped = sum(case.find("skipped") is not None for case in cases)
          print(f"{len(cases) - len(failures) - len(errors) - skipped} passed, "
                f"{skipped} skipped, {len(failures)} failed, {len(errors)} errors")
          unexpected = []
          for case in failures:
              key = (case.get("classname", "").split(".")[-1], case.get("name"))
              failure = case.find("failure")
              details = failure.get("message", "") + (failure.text or "")
              if key not in documented or (
                  key[0] == "test_manager" and "ScreenSaverCustomText" not in details
              ):
                  unexpected.append(key)
              else:
                  print(f"Documented base failure: {'::'.join(key)}")
          if errors or unexpected or not cases or (status == "1" and not failures):
              raise SystemExit(f"Unexpected pytest outcome: {unexpected}")
          PY
