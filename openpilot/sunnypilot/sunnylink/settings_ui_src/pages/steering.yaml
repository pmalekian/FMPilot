# Page: steering
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: steering
label: Steering
icon: steering_wheel
order: 1
remote_configurable: true
description: Lateral control, lane changes, and steering behavior
sections:
- id: mads
  title: Modular Assistive Driving System (MADS)
  description: ''
  items:
  - key: Mads
    widget: toggle
    title: Enable Modular Assistive Driving System (MADS)
    description: Enable MADS. Disable toggle to revert back to stock sunnypilot engagement/disengagement.
    enablement:
    - $ref: '#/macros/offroad'
  sub_panels:
  - id: mads_settings
    label: MADS Settings
    trigger_key: Mads
    trigger_condition:
      type: param
      key: Mads
      equals: true
    items:
    - key: RivianEnhancedMads
      widget: toggle
      title: Use enhanced Rivian MADS
      description: 'Adds to MADS on Rivian: one click up on the stalk turns steering assist on or off, every brake mode
        can be chosen, shifting into Park or Reverse or a full stalk pull switches MADS off, and a minimum speed to engage
        can be set. When off, MADS works as in stock sunnypilot: the brake turns steering assist off and it comes back
        with cruise.'
      needs_onroad_cycle: true
      enablement:
      - $ref: '#/macros/offroad'
      - {type: capability, field: brand, equals: rivian}
    - key: MadsMainCruiseAllowed
      widget: toggle
      title: Toggle with Main Cruise
      description: 'Note: For vehicles without LFA/LKAS button, disabling this will prevent lateral control engagement.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsUnifiedEngagementMode
      widget: toggle
      title: Unified Engagement Mode (UEM)
      description: 'Engage lateral and longitudinal control with cruise control engagement. Note: Once lateral control is
        engaged via UEM, it will remain engaged until it is manually disabled via the MADS button or car shut off.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsSteeringMode
      widget: multiple_button
      title: Steering Mode on Brake Pedal
      description: Choose how Automatic Lane Centering (ALC) behaves after the brake pedal is manually pressed in sunnypilot.
      options:
      - value: 0
        label: Remain Active
        enablement:
        - $ref: '#/macros/mads_steering_full_platforms'
      - value: 1
        label: Pause
        enablement:
        - $ref: '#/macros/mads_steering_full_platforms'
      - value: 2
        label: Disengage
      enablement:
      - $ref: '#/macros/offroad'
    - key: MadsMinEngageSpeed
      widget: option
      title: Minimum Speed to Engage MADS
      description: Minimum vehicle speed required to (re-)engage MADS lateral control. In Pause mode this also applies
        to resuming after the brake is released, so steering assist comes back once the car reaches this speed. 0 = no
        minimum.
      min: 0
      max: 20
      step: 1
      unit:
        metric: km/h
        imperial: mph
      needs_onroad_cycle: true
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/rivian_enhanced_mads'
- id: lane_centering
  title: Lane Centering
  description: Keep the car in the middle of the lane. One of Lane Centering, Lane Guard or Blendful
  items:
  - key: FM_LaneKeepMode
    widget: option
    title: Lane Centering
    description: 'Pick one way of keeping the car in its lane, or Off for the driving model alone. Lane Centering:
      keeps the car in the middle of the painted lane instead of wherever the driving model chooses to sit; only acts
      when both lane lines are clearly visible (unless One-Line Mode is on), and steps aside for lane changes and turn
      signals. Lane Guard: a gentle correction only when the planned path brings the body too close to a lane line or
      road edge; pauses while you steer or signal (from gerrylum''s rx-wb). Blendful (alpha): a gentle nudge toward the
      lane center on top of the model''s own steering, stronger when the lane lines are clear; yields around obstacles,
      off below 11 mph and during turns and lane changes. Needs a custom (non-Default) model (from sunnypilot).'
    details: |-
      Lane Centering's corrections are deliberately small and are smoothed in over about half a second, so this should
      read as the car sitting straighter rather than as active steering. Whenever the lane lines become unreliable, a
      lane change starts or a turn signal comes on, the correction fades away rather than being dropped in one go.
      Only one of the three can be on at a time.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Lane Centering
    - value: 2
      label: Lane Guard
    - value: 3
      label: Blendful
  - key: RivianOfftrackCompensationEnabled
    widget: toggle
    title: Rear-Axle Off-Tracking Compensation
    description: Widens tight turns so the rear wheels, which cut inside the front's path, are less likely to clip a curb. A
      geometric estimate, not curb sensing. Makes turns wider, so leave it off if turns already run wide.
    visibility:
    - type: capability
      field: brand
      equals: rivian
    sub_items:
    - key: RivianOfftrackCompensationGain
      widget: option
      title: Compensation Gain
      description: 0 = off, 1 = full geometric compensation.
      min: 0.0
      max: 1.0
      step: 0.05
      enablement:
      - type: param
        key: RivianOfftrackCompensationEnabled
        equals: true
  sub_panels:
  - id: lane_centering_settings
    label: Lane Centering Settings
    trigger_key: FM_LaneKeepMode
    trigger_condition:
      type: param
      key: FM_LaneKeepMode
      equals: 1
    items:
    - key: LaneCenteringOffset
      widget: option
      title: Position in Lane
      description: Sit deliberately off the middle of the lane. Positive values sit to the right, negative to the left.
        The car is never aimed closer than 1.1 m/3.6 ft to either line, so a large offset in a narrow lane is trimmed back.
      min: -0.3
      max: 0.3
      step: 0.01
      unit: meters
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    # Permanent. What suits one car, model and road does not suit the next, and comparing values needs
    # them changeable between legs of a single drive rather than a rebuild per value.
    - key: LaneCenteringGain
      widget: option
      title: Centering Strength
      description: Sets how hard the car is pulled back toward the middle of the lane. Higher means it sits closer to the
        middle but works harder to get there. 0.6 suits the cars and roads tested so far. Lower feels smoother than it really
        is, and 0.3 is too weak to hold against a road crown, leaving the car sitting off center all day.
      min: 0.0
      max: 1.0
      step: 0.1
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    # Permanent, same reason as the strength above.
    - key: LaneCenteringDeadband
      widget: option
      title: Close Enough To Center
      description: How far off the middle of the lane the car is allowed to sit before lane centering does anything about
        it. Smaller sits closer to the middle. It does not make the car calmer. A wide tolerance lets the car drift to the
        edge and get kicked back, which reverses more often, not less. Road testing settled on 0.02. The car's own screen
        shows this in cm/in.
      min: 0.0
      max: 0.15
      step: 0.01
      unit: meters
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    - key: LaneCenteringE2EAuthority
      widget: option
      title: Let the Model Sit Off Center
      description: How much freedom the driving model keeps to sit well off the middle of the lane when it is sure of itself,
        which usually means it is avoiding something. 1.0 always lets it have its way, 0 centers the car regardless. This
        only applies to large departures; small ones are always corrected.
      min: 0.0
      max: 1.0
      step: 0.1
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    - key: LaneCenteringSingleLine
      widget: toggle
      title: One-Line Mode
      description: When only one lane line is clearly visible, such as on an on-ramp with a faded edge line or a town street
        with a center line and a bare curb, keep the car from sitting too close to that line. It only ever moves the car away
        from the visible line, never past the middle of the lane, and not at all when it cannot see anything on the other side.
      details: |-
        Experimental. It never aims at a lane middle it cannot see. Anything the driving model is unsure of on the far side,
        such as a faint line or the edge of the tarmac, can only make the move smaller. It does not follow a line that
        bends away from the car's path, such as the line at a highway exit. Position in Lane and Let the Model Sit Off Center
        do not apply in this mode.
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    - key: LaneCenteringSingleLineEdgeDist
      widget: option
      title: One-Line Mode, Distance From an Edge Line
      description: How far One-Line Mode keeps the car from a visible line at the edge of the road. 1.5 is the car's normal
        position in a lane. Smaller sits closer to the line, larger moves further away from it. These are the driving model's
        own distances, not a measured gap between tire and paint.
      min: 1.2
      max: 1.8
      step: 0.05
      unit: meters
      enablement:
      - type: param
        key: LaneCenteringSingleLine
        equals: true
    - key: LaneCenteringSingleLineLaneDist
      widget: option
      title: One-Line Mode, Distance From a Center or Lane Line
      description: How far One-Line Mode keeps the car from a visible center line or line between lanes. 1.5 is the car's normal
        position in a lane. Smaller sits closer to the line, larger moves further away from it. When it cannot tell which kind
        of line it is, the smaller of the two distances is used.
      min: 1.2
      max: 1.8
      step: 0.05
      unit: meters
      enablement:
      - type: param
        key: LaneCenteringSingleLine
        equals: true
    - key: LaneCenteringDisplay
      widget: toggle
      title: Show Correction On Screen
      description: Draws a small bar while driving showing which way lane centering is nudging the car and how hard. The
        bar fills to the side the car is being pulled, stays dim while the car is already close enough to the middle, and
        turns gray when the lane lines cannot be trusted. While One-Line Mode is keeping the car clear of a single
        line the bar turns light blue, a mark at its end shows which side that line is on, and the screen says "one
        line".
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
- id: blinker
  title: Blinker Control
  description: Lateral pause behavior during turn signals
  items:
  - key: BlinkerPauseLateralControl
    widget: toggle
    title: Pause Lateral Control with Blinker
    description: Pause lateral control with blinker when traveling below the desired speed selected.
    sub_items:
    - key: BlinkerMinLateralControlSpeed
      widget: option
      title: Minimum Speed to Pause Lateral Control
      min: 0
      max: 255
      step: 5
      unit:
        metric: km/h
        imperial: mph
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
    - key: BlinkerLateralReengageDelay
      widget: option
      title: Post-Blinker Delay
      description: Delay before lateral control resumes after the turn signal ends.
      min: 0
      max: 10
      step: 1
      unit: second
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
- id: torque
  title: Torque Control
  description: Steering torque tuning and lateral control method
  enablement:
  - type: capability
    field: torque_allowed
    equals: true
  items:
  - key: EnforceTorqueControl
    widget: toggle
    title: Enforce Torque Lateral Control
    description: Enable this to enforce sunnypilot to steer with Torque lateral control.
    visibility:
    - type: not
      condition:
        type: capability
        field: steer_control_type
        equals: angle
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: torque_allowed
      equals: true
    - type: param
      key: NeuralNetworkLateralControl
      equals: false
  - key: FM_PandaHighTorque
    widget: toggle
    title: Panda Allows Higher Torque
    description: 'Testing backup. Lets the panda allow up to Max Torque (below) under about 20 mph (AP''s limit is 385),
      tapering to the usual limits by about 38 mph; highway limits are unchanged. Only changes in off-road mode and
      applies from the next drive. While off, Higher Torque below stays at 385.'
    needs_onroad_cycle: true
    enablement:
    - $ref: '#/macros/offroad'
    - {type: capability, field: brand, equals: rivian}
  - key: FM_MaxTorque
    widget: option
    title: Max Torque
    description: 'Testing. The low-speed steering torque limit the panda allows when Panda Allows Higher Torque is on:
      405 to 580 in steps of 25 (AP''s limit is 385; 480 is about the earlier fixed 481). The panda enforces exactly this
      number for the whole drive, under about 20 mph, tapering to the usual limits by about 38 mph. Only changes in
      off-road mode and applies from the next drive.'
    min: 405
    max: 580
    step: 25
    needs_onroad_cycle: true
    enablement:
    - $ref: '#/macros/offroad'
    - {type: capability, field: brand, equals: rivian}
    - {type: param, key: FM_PandaHighTorque, equals: true}
  - key: FM_TorqueFastRamp
    widget: toggle
    title: Faster Torque Ramp
    description: 'Testing. Lets steering torque build 5 per step instead of 3 under 25 mph, so full torque arrives in
      about 1 s instead of about 1.6 s. The panda checks it too (up to about 28 mph); the quarter-second limit and
      everything above 25 mph are unchanged. Needs Panda Allows Higher Torque. Only changes in off-road mode and
      applies from the next drive.'
    needs_onroad_cycle: true
    enablement:
    - $ref: '#/macros/offroad'
    - {type: capability, field: brand, equals: rivian}
    - {type: param, key: FM_PandaHighTorque, equals: true}
  - key: FM_TorqueFullCapHighAngle
    widget: toggle
    title: Full Torque Past 90°
    description: 'Testing. Past 90° of steering wheel, AP holds torque to 95% of the limit (457 of 481). On, it can use
      the full Max Torque there. The panda''s limit is the same either way. Needs Panda Allows Higher Torque. Only
      changes in off-road mode and applies from the next drive.'
    needs_onroad_cycle: true
    enablement:
    - $ref: '#/macros/offroad'
    - {type: capability, field: brand, equals: rivian}
    - {type: param, key: FM_PandaHighTorque, equals: true}
  - key: FM_TorqueMode
    widget: multiple_button
    title: Higher Torque
    description: 'More steering torque under about 20 mph, up to Max Torque (AP''s limit is 385), back to normal by about 38 mph.
      Needs Panda Allows Higher Torque on when the drive started; otherwise it stays at 385. Headroom: steering feels
      the same until it runs out of torque, then it can go further. Full: every request at low speed is about 25%
      stronger, like AP''s earlier 481 test. Changes take effect while driving and blend in over a second.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Headroom
    - value: 2
      label: Full
    enablement:
    - {type: capability, field: brand, equals: rivian}
  - key: FM_LowSpeedGainEnabled
    widget: toggle
    title: Calmer Low-Speed Correction
    description: 'Under about 16 mph, openpilot corrects steering errors very hard, then overshoots and corrects back
      the other way, which you can feel as the wheel grabbing and swinging in slow turns. This tones that correction
      down to Calmer Low-Speed Correction Strength, blending back to normal by 20 mph; highway steering is unchanged.
      Turns may build torque a little more gently at the start. Changes take effect while driving. On by default.'
    enablement:
    - {type: capability, field: brand, equals: rivian}
  - key: FM_LowSpeedGainPercent
    widget: option
    title: Calmer Low-Speed Correction Strength
    description: 'How much of openpilot''s low-speed correction to keep. 100% is openpilot''s; lower is calmer but
      builds torque more gently. Default 70%.'
    min: 40
    max: 100
    step: 10
    unit: '%'
    enablement:
    - {type: capability, field: brand, equals: rivian}
    - {type: param, key: FM_LowSpeedGainEnabled, equals: true}
  - key: FM_LowSpeedFFEnabled
    widget: toggle
    title: Low-Speed Steering Feedforward
    description: 'Under about 10 mph openpilot only starts adding steering torque once the truck is already turning too
      little, so slow turns start late and run wide (about 15-19% wider than asked in the Nov 11 logs). This sends torque
      for the wheel angle the turn needs right away, fading out by about 16 mph. Set how strong for left and right
      turns separately (or Off for one side): start at Gentle and step up if turns still run wide. Changes take effect while driving.
      Not available with Lateral Jerk Torque Controller or Neural Network Lateral Control, which build their own.'
    enablement:
    - {type: capability, field: brand, equals: rivian}
    - {type: param, key: LateralJerkTorqueController, equals: false}
    - {type: param, key: NeuralNetworkLateralControl, equals: false}
  - key: FM_LowSpeedFFStepLeft
    widget: multiple_button
    title: Low-Speed Feedforward Left Turns
    description: 'Strength for left turns and curves. Gentle (40%) is the place to start. Step up one at a time if
      slow left turns still start late or run wide; step down if the wheel turns in further than the path. Off
      leaves left turns as before (only the right side gets it). Full matches what the Nov 11 logs measured
      and never goes past it; tight turns under 10 mph are estimated from slightly faster ones.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Gentle
    - value: 2
      label: Medium
    - value: 3
      label: Firm
    - value: 4
      label: Full
    enablement:
    - {type: capability, field: brand, equals: rivian}
    - {type: param, key: FM_LowSpeedFFEnabled, equals: true}
  - key: FM_LowSpeedFFStepRight
    widget: multiple_button
    title: Low-Speed Feedforward Right Turns
    description: 'Strength for right turns and curves. Gentle (40%) is the place to start. Step up one at a time if
      slow right turns still start late or run wide; step down if the wheel turns in further than the path. Off
      leaves right turns as before (only the left side gets it). Full matches what the Nov 11 logs measured
      and never goes past it; tight turns under 10 mph are estimated from slightly faster ones.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Gentle
    - value: 2
      label: Medium
    - value: 3
      label: Firm
    - value: 4
      label: Full
    enablement:
    - {type: capability, field: brand, equals: rivian}
    - {type: param, key: FM_LowSpeedFFEnabled, equals: true}
  - key: FM_ReleaseGuard
    widget: toggle
    title: Release Guard
    description: 'In a slow turn, when you hold the wheel tighter than openpilot wants, openpilot pushes back against
      your hands, and when you let go that push is still there and swings the wheel past center. This limits how hard
      openpilot pushes against you while you steer into the turn, so there is less left to unwind when you let go.
      Only while you press into the turn the truck is already making, under 15 mph (gone by 20). Fades out half a
      second after you let go, and never weakens the pull back once the wheel has passed openpilot''s target.
      Changes take effect while driving. Not available with Lateral Jerk Torque Controller or Neural Network Lateral
      Control.'
    enablement:
    - {type: capability, field: brand, equals: rivian}
    - {type: param, key: LateralJerkTorqueController, equals: false}
    - {type: param, key: NeuralNetworkLateralControl, equals: false}
  - key: FM_ReleaseGuardMax
    widget: multiple_button
    title: Most Torque Against You
    description: 'How hard openpilot may still push against you while you steer into a turn, in torque counts (it can
      send up to 580). 150 leaves a light push back; 75 almost none. In the Nov 11 logs 150 cut the push still swinging
      the wheel past center after you let go from 0.6-0.8 s to under 0.2 s.'
    options:
    - value: 75
      label: '75'
    - value: 150
      label: '150'
    enablement:
    - {type: capability, field: brand, equals: rivian}
    - {type: param, key: FM_ReleaseGuard, equals: true}
  sub_panels:
  - id: torque_settings
    label: Torque Settings
    trigger_key: EnforceTorqueControl
    trigger_condition:
      type: param
      key: EnforceTorqueControl
      equals: true
    items:
    - key: LateralJerkTorqueController
      widget: toggle
      title: Lateral Jerk Torque Controller
      description: Looks ahead at planned steering to reduce sudden corrections, so the wheel moves more smoothly through turns. Works with Self-Tune and custom tuning. Thanks to @twilsonco for the implementation.
      visibility:
      - type: not
        condition:
          type: capability
          field: steer_control_type
          equals: angle
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: NeuralNetworkLateralControl
        equals: false
    - key: LiveTorqueParamsToggle
      widget: toggle
      title: Self-Tune
      description: Enables self-tune for Torque lateral control for platforms that do not use Torque lateral control by default.
      enablement:
      - $ref: '#/macros/offroad'
    - key: LiveTorqueParamsRelaxedToggle
      widget: toggle
      title: Less Restrict Settings for Self-Tune (Beta)
      description: Less strict settings when using Self-Tune. This allows torqued to be more forgiving when learning values.
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: LiveTorqueParamsToggle
        equals: true
    - key: CustomTorqueParams
      widget: toggle
      title: Enable Custom Tuning
      description: Enables custom tuning for Torque lateral control. Modifying Lateral Acceleration Factor and Friction below
        will override the offline values indicated in the YAML files within "opendbc/car/torque_data". The values will also
        be used live when "Manual Real-Time Tuning" toggle is enabled.
      enablement:
      - $ref: '#/macros/offroad'
    - key: TorqueParamsOverrideEnabled
      widget: toggle
      title: Manual Real-Time Tuning
      description: Enforces the torque lateral controller to use the fixed values instead of the learned values from Self-Tune.
        Enabling this toggle overrides Self-Tune values.
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: CustomTorqueParams
        equals: true
    - key: TorqueParamsOverrideLatAccelFactor
      widget: option
      title: Lateral Acceleration Factor
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.1
      max: 5.0
      step: 0.1
      unit: m/s²
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueParamsOverrideFriction
      widget: option
      title: Friction
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.0
      max: 1.0
      step: 0.01
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueControlTune
      widget: multiple_button
      title: Torque Control Tune Version
      description: Select the version of Torque Control Tune to use.
      options:
      - value: ''
        label: Default
      - value: 1.0
        label: v1.0
      - value: 0.0
        label: v0.0
      enablement:
      - $ref: '#/macros/offroad'
- id: lane_change
  title: Lane Change
  description: Automatic lane change timing and behavior
  items:
  - key: AutoLaneChangeTimer
    widget: option
    title: Auto Lane Change by Blinker
    description: |-
      Set a timer to delay the auto lane change operation when the blinker is used. No nudge on the steering wheel is required to auto lane change if a timer is set. Default is Nudge.
    details: |-
      Please use caution when using this feature. Only use the blinker when traffic and road conditions permit.
    options:
    - value: -1
      label: 'Off'
    - value: 0
      label: Nudge
    - value: 1
      label: Nudgeless
    - value: 2
      label: 0.5 second
    - value: 3
      label: 1 second
    - value: 4
      label: 2 seconds
    - value: 5
      label: 3 seconds
  - key: RoadEdgeLaneChangeEnabled
    widget: toggle
    title: 'Block Lane Change: Road Edge Detection'
    description: Blocks lane change when the model sees a road edge on the side you signal, with a small gray message and
      no sound. Needed for Road Edge Turn Desire (Models > Model Behavior).
  - key: AutoLaneChangeBsmDelay
    widget: toggle
    title: 'Auto Lane Change: Delay with Blind Spot'
    description: Toggle to enable a delay timer for lane changes when blind spot monitoring (BSM) detects a vehicle in your blind
      spot.
    enablement:
    - type: capability
      field: enable_bsm
      equals: true
    - type: param_compare
      key: AutoLaneChangeTimer
      op: '>'
      value: 0
- id: lane_change_and_turns
  title: 'FM Pilot: Turn Tweaks'
  description: Stronger, earlier and steadier steering during slow blinker turns
  items:
  - key: FM_TurnBoostEnabled
    widget: toggle
    title: Turn Boost
    description: During a blinker turn under 20 mph, ask for a tighter turn than the model does, so the steering reaches full
      torque sooner. Separate strength for left and right turns (1.00 means no boost). Fades in and out smoothly; normal
      driving is not affected.
  - key: FM_TurnHoldEnabled
    widget: toggle
    title: Turn Hold
    description: During a blinker turn under 20 mph, keep the model from letting go of the turn halfway. Holds the steering
      request near the turn's strongest point, easing off gradually, until the truck has turned about 75 degrees, the blinker
      is cancelled, or you steer. Works with Turn Lead, but using one at a time is recommended so each turn is easier to
      judge.
  - key: FM_TurnLeadEnabled
    widget: toggle
    title: Turn Lead
    description: During a blinker turn from Turn Lead Min Speed up to about 16 mph, start turning on time when the model
      turns in late. Reads the curve of the planned path just ahead and asks for it until the truck catches up, then hands
      back to the model. Never asks for a tighter turn than Turn Path Tightest Radius. Works with Turn Hold, but using one at a time is
      recommended so each turn is easier to judge. From StarPilot's Model Turn Assist.
  - key: FM_TurnPhaseIn
    widget: toggle
    title: Smooth Turn Start
    description: Whatever Turn Boost, Turn Lead, Turn Hold and Turn Nudge add on top of the model eases in over about a
      third of a second instead of arriving all at once, so the steering doesn't grab and then swing back. It still
      lets go at once, so handing back to the model isn't delayed. The model's own steering is never slowed. On by default.
    enablement:
    - type: any
      conditions:
      - type: param
        key: FM_TurnBoostEnabled
        equals: true
      - type: param
        key: FM_TurnHoldEnabled
        equals: true
      - type: param
        key: FM_TurnLeadEnabled
        equals: true
  - key: FM_TurnCarryThrough
    widget: toggle
    title: Finish Turn After Signal Cancels
    description: If the blinker goes off (or cancels itself) while the truck is still turning, Turn Boost, Lead and Hold keep
      helping until the truck straightens out, for up to 6 seconds, instead of dropping back to the model at once. Ends
      right away if you steer against the turn, openpilot stops steering or you reach 20 mph. The model, the Turning alert
      and lane changes still follow the blinker. On by default.
    enablement:
    - type: any
      conditions:
      - type: param
        key: FM_TurnBoostEnabled
        equals: true
      - type: param
        key: FM_TurnHoldEnabled
        equals: true
      - type: param
        key: FM_TurnLeadEnabled
        equals: true
  - key: FM_TurnPathMinRadius
    widget: option
    title: Turn Path Tightest Radius
    description: The tightest turn Turn Lead and Hold Path Source may ask for on their own, as a radius. Smaller is
      stronger; 8 m is the strongest. Default 12 m. Your own steering (Hold Adds Your Steering) isn't limited by it.
    min: 8
    max: 20
    step: 1
    unit: m
    enablement:
    - type: any
      conditions:
      - type: param
        key: FM_TurnLeadEnabled
        equals: true
      - type: param
        key: FM_TurnHoldPathSource
        equals: true
  - key: FM_LowSpeedCurvatureFloor
    widget: toggle
    title: Calmer Crawl-Speed Steering
    description: 'Below 5.6 mph, ask for less steering than the model''s raw output (about 64% at 4.5 mph, 36% at 3.4 mph,
      16% at 2.2 mph), as sunnypilot and openpilot now do. Calms twitchy steering near a stop, but turns pulled out from
      a stop may start softer. Applies to all driving, not only blinker turns. Off: FM Pilot''s previous behavior. From
      sunnypilot #2091.'
  - key: FM_LateralSmoothingEnabled
    widget: toggle
    title: Lateral Smoothing
    description: 'Replaces the model''s own built-in lateral smoothing value (each model sets its own, often 0 or 0.1 s)
      with the one you pick in Lateral Smoothing Settings. It does two things at once. Higher smooths the model''s steering
      request more, which calms jitter but answers a little later. Higher also reads the model''s plan slightly further
      ahead, which starts steering earlier. Which one you feel more depends on the model and the road. Applies to all
      driving, not only turns. Off: each model uses its own value.'
  sub_panels:
  - id: lateral_smoothing_settings
    label: Lateral Smoothing Settings
    trigger_key: FM_LateralSmoothingEnabled
    trigger_condition:
      type: param
      key: FM_LateralSmoothingEnabled
      equals: true
    items:
    - key: FM_LateralSmoothingSeconds
      widget: option
      title: Lateral Smoothing Seconds
      description: 'Seconds of lateral smoothing and look-ahead. 0: raw model steering, read from the plan as it is now.
        0.1 (default): a common model setting. 0.2: smoothest, reads furthest ahead. Applies to custom models; takes up
        to a few seconds to apply while driving.'
      min: 0.0
      max: 0.2
      step: 0.1
      unit: s
      enablement:
      - type: param
        key: FM_LateralSmoothingEnabled
        equals: true
  - id: turn_boost_settings
    label: Turn Boost Settings
    trigger_key: FM_TurnBoostEnabled
    trigger_condition:
      type: param
      key: FM_TurnBoostEnabled
      equals: true
    items:
    - key: FM_TurnBoostLeft
      widget: option
      title: Turn Boost Left
      description: How much tighter to ask for left turns. 1.10 asks for 10% more curve than the model.
      min: 1.0
      max: 1.5
      step: 0.05
      enablement:
      - type: param
        key: FM_TurnBoostEnabled
        equals: true
    - key: FM_TurnBoostRight
      widget: option
      title: Turn Boost Right
      description: How much tighter to ask for right turns. 1.20 asks for 20% more curve than the model.
      min: 1.0
      max: 1.5
      step: 0.05
      enablement:
      - type: param
        key: FM_TurnBoostEnabled
        equals: true
  - id: turn_hold_settings
    label: Turn Hold Settings
    trigger_key: FM_TurnHoldEnabled
    trigger_condition:
      type: param
      key: FM_TurnHoldEnabled
      equals: true
    items:
    - key: FM_TurnHoldPathSource
      widget: toggle
      title: Hold Path Source
      description: When starting a turn from a stop or a crawl (under about 2 mph), also take the turn from the planned
        path, so the truck turns even if the model's steering request still says straight. Never tighter than Turn Path
        Tightest Radius. From StarPilot's Model Turn Assist.
      enablement:
      - type: param
        key: FM_TurnHoldEnabled
        equals: true
    - key: FM_TurnNudgeEnabled
      widget: toggle
      title: Turn Nudge
      description: Adds a brief steering assist when you nudge the wheel into a signaled turn at 2 to 8 mph and the nearby
        planned path already bends that way. Steering against the turn cancels the extra assist.
      enablement:
      - type: param
        key: FM_TurnHoldEnabled
        equals: true
    - key: FM_TurnHoldDriverAdds
      widget: toggle
      title: Hold Adds Your Steering
      description: When you steer into the turn, Turn Hold keeps the curve you gave it, up to full lock, instead of letting
        go and instead of pushing back toward a wider turn, so the help stays once you let go of the wheel. Steering into the turn never releases it,
        even before the truck starts turning; steering against the turn still releases it. From StarPilot's Model Turn
        Assist.
      enablement:
      - type: param
        key: FM_TurnHoldEnabled
        equals: true
    - key: FM_TurnHoldEarlyCorrection
      widget: toggle
      title: Hold Through Early Correction
      description: At the start of a turn (under 5 mph, before the truck has turned 20 degrees), steering against the turn,
        like straightening the truck before turning, doesn't release Turn Hold. It picks up again when you let go. Later in
        the turn or above 5 mph, steering against the turn still releases it.
      enablement:
      - type: param
        key: FM_TurnHoldEnabled
        equals: true
    - key: FM_TurnHoldReleaseDebounce
      widget: toggle
      title: Ignore Brief Hand Blips
      description: Steering against the turn releases Turn Hold only once it lasts a quarter second, or at once with a firm
        push (0.5 Nm or more). A brief flicker as your hand relaxes on the wheel no longer ends the hold for the rest of the
        turn. On by default.
      enablement:
      - type: param
        key: FM_TurnHoldEnabled
        equals: true
  - id: turn_lead_settings
    label: Turn Lead Settings
    trigger_key: FM_TurnLeadEnabled
    trigger_condition:
      type: param
      key: FM_TurnLeadEnabled
      equals: true
    items:
    - key: FM_TurnLeadMinSpeed
      widget: option
      title: Turn Lead Min Speed
      description: Lowest speed Turn Lead works at; it reaches full strength about 2 mph above this. Lower it to help turns
        that start late when pulling away from a stop. 7 mph is about StarPilot's fixed value. Below 2 mph, Turn Hold's Hold Path
        Source covers turns from a stop.
      min: 2
      max: 7
      step: 1
      unit: mph
      enablement:
      - type: param
        key: FM_TurnLeadEnabled
        equals: true
    - key: FM_TurnLeadAdaptive
      widget: toggle
      title: Adaptive Look-Ahead
      description: Reads the path only as far ahead as the steering actually lags, 0.5 s for a gentle curve up to 0.9 s
        for a tight turn, instead of a fixed 1.3 s, so the turn doesn't start several meters before the corner. Off is the
        fixed 1.3 s. On by default.
      enablement:
      - type: param
        key: FM_TurnLeadEnabled
        equals: true
    - key: FM_TurnLeadGate
      widget: toggle
      title: Wait for the Corner
      description: Turn Lead only starts once the corner is close, within Turn Lead Start Distance, instead of as soon
        as the planned path shows a turn somewhere ahead. Stops it from turning toward the curb before you reach the
        corner. On by default.
      enablement:
      - type: param
        key: FM_TurnLeadEnabled
        equals: true
    - key: FM_TurnLeadGateDist
      widget: option
      title: Turn Lead Start Distance
      description: How close the corner has to be (where the planned path has turned 10 degrees, a couple of meters into
        it) before Turn Lead acts. Smaller starts later. Default 5 m, about 2 to 3 m before the corner.
      min: 3
      max: 10
      step: 1
      unit: m
      enablement:
      - type: param
        key: FM_TurnLeadEnabled
        equals: true
      - type: param
        key: FM_TurnLeadGate
        equals: true
