# Page: steering
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: steering
label: Steering
icon: steering_wheel
order: 1
remote_configurable: true
description: Lateral control, lane changes, and steering behavior
sections:
- id: mads
  title: Modular Assistive Driving System (MADS)
  description: ''
  items:
  - key: Mads
    widget: toggle
    title: Enable Modular Assistive Driving System (MADS)
    description: Enable MADS. Disable toggle to revert back to stock sunnypilot engagement/disengagement.
    enablement:
    - $ref: '#/macros/offroad'
  sub_panels:
  - id: mads_settings
    label: MADS Settings
    trigger_key: Mads
    trigger_condition:
      type: param
      key: Mads
      equals: true
    items:
    - key: RivianEnhancedMads
      widget: toggle
      title: Use enhanced Rivian MADS
      description: 'Adds to MADS on Rivian: one click up on the stalk turns steering assist on or off, every brake mode
        can be chosen, shifting into Park or Reverse or a full stalk pull switches MADS off, and a minimum speed to engage
        can be set. When off, MADS works as in stock sunnypilot: the brake turns steering assist off and it comes back
        with cruise.'
      needs_onroad_cycle: true
      enablement:
      - $ref: '#/macros/offroad'
      - {type: capability, field: brand, equals: rivian}
    - key: MadsMainCruiseAllowed
      widget: toggle
      title: Toggle with Main Cruise
      description: 'Note: For vehicles without LFA/LKAS button, disabling this will prevent lateral control engagement.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsUnifiedEngagementMode
      widget: toggle
      title: Unified Engagement Mode (UEM)
      description: 'Engage lateral and longitudinal control with cruise control engagement. Note: Once lateral control is
        engaged via UEM, it will remain engaged until it is manually disabled via the MADS button or car shut off.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsSteeringMode
      widget: multiple_button
      title: Steering Mode on Brake Pedal
      description: Choose how Automatic Lane Centering (ALC) behaves after the brake pedal is manually pressed in sunnypilot.
      options:
      - value: 0
        label: Remain Active
        enablement:
        - $ref: '#/macros/mads_steering_full_platforms'
      - value: 1
        label: Pause
        enablement:
        - $ref: '#/macros/mads_steering_full_platforms'
      - value: 2
        label: Disengage
      enablement:
      - $ref: '#/macros/offroad'
    - key: MadsMinEngageSpeed
      widget: option
      title: Minimum Speed to Engage MADS
      description: Minimum vehicle speed required to (re-)engage MADS lateral control. In Pause mode this also applies
        to resuming after the brake is released, so steering assist comes back once the car reaches this speed. 0 = no
        minimum.
      min: 0
      max: 20
      step: 1
      unit:
        metric: km/h
        imperial: mph
      needs_onroad_cycle: true
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/rivian_enhanced_mads'
- id: lane_centering
  title: Lane Centering
  description: Keep the car in its lane. One of Lane Centering, Lane Guard or Blendful (FM Pilot)
  items:
  - key: FM_LaneKeepMode
    widget: option
    title: Lane Centering
    description: 'FM Pilot - pick one way of keeping the car in its lane, or Off for the driving model alone. Lane
      Centering (AdventurePilot): keeps the car in the middle of the painted lane instead of wherever the driving model
      chooses to sit; only acts when both lane lines are clearly visible (unless One-Line Mode is on), and steps aside for
      lane changes and turn signals. Lane Guard: a gentle correction only when the planned path brings the body too close
      to a lane line or road edge; pauses while you steer or signal (from gerrylum''s rx-wb). Blendful (alpha): a gentle
      nudge toward the lane center on top of the model''s own steering, stronger when the lane lines are clear; yields
      around obstacles, works down to about 1 mph (0.3 m/s), off during turns and lane changes; draws its blue center
      line. Needs a custom (non-Default) model (from sunnypilot).'
    details: |-
      Lane Centering's corrections are deliberately small and are smoothed in over about half a second, so this should
      read as the car sitting straighter rather than as active steering. Whenever the lane lines become unreliable, a
      lane change starts or a turn signal comes on, the correction fades away rather than being dropped in one go.
      Only one of the three can be on at a time.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Lane Centering
    - value: 2
      label: Lane Guard
    - value: 3
      label: Blendful
  sub_panels:
  - id: lane_centering_settings
    label: Lane Centering Settings
    trigger_key: FM_LaneKeepMode
    trigger_condition:
      type: param
      key: FM_LaneKeepMode
      equals: 1
    items:
    - key: LaneCenteringOffset
      widget: option
      title: Position in Lane
      description: Sit deliberately off the middle of the lane. Positive values sit to the right, negative to the left.
        The car is never aimed closer than 1.1 m/3.6 ft to either line, so a large offset in a narrow lane is trimmed back.
      min: -0.3
      max: 0.3
      step: 0.01
      unit: meters
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    # Permanent. What suits one car, model and road does not suit the next, and comparing values needs
    # them changeable between legs of a single drive rather than a rebuild per value.
    - key: LaneCenteringGain
      widget: option
      title: Centering Strength
      description: Sets how hard the car is pulled back toward the middle of the lane. Higher means it sits closer to the
        middle but works harder to get there. 0.6 suits the cars and roads tested so far. Lower feels smoother than it really
        is, and 0.3 is too weak to hold against a road crown, leaving the car sitting off center all day.
      min: 0.0
      max: 1.0
      step: 0.1
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    # Permanent, same reason as the strength above.
    - key: LaneCenteringDeadband
      widget: option
      title: Close Enough To Center
      description: How far off the middle of the lane the car is allowed to sit before lane centering does anything about
        it. Smaller sits closer to the middle. It does not make the car calmer. A wide tolerance lets the car drift to the
        edge and get kicked back, which reverses more often, not less. Road testing settled on 0.02. The car's own screen
        shows this in cm/in.
      min: 0.0
      max: 0.15
      step: 0.01
      unit: meters
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    - key: LaneCenteringE2EAuthority
      widget: option
      title: Let the Model Sit Off Center
      description: How much freedom the driving model keeps to sit well off the middle of the lane when it is sure of itself,
        which usually means it is avoiding something. 1.0 always lets it have its way, 0 centers the car regardless. This
        only applies to large departures; small ones are always corrected.
      min: 0.0
      max: 1.0
      step: 0.1
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    - key: LaneCenteringSingleLine
      widget: toggle
      title: One-Line Mode
      description: When only one lane line is clearly visible, such as on an on-ramp with a faded edge line or a town street
        with a center line and a bare curb, keep the car from sitting too close to that line. It only ever moves the car away
        from the visible line, never past the middle of the lane, and not at all when it cannot see anything on the other side.
      details: |-
        Experimental. It never aims at a lane middle it cannot see. Anything the driving model is unsure of on the far side,
        such as a faint line or the edge of the tarmac, can only make the move smaller. It does not follow a line that
        bends away from the car's path, such as the line at a highway exit. Position in Lane and Let the Model Sit Off Center
        do not apply in this mode.
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    - key: LaneCenteringSingleLineEdgeDist
      widget: option
      title: One-Line Mode, Distance From an Edge Line
      description: How far One-Line Mode keeps the car from a visible line at the edge of the road. 1.5 is the car's normal
        position in a lane. Smaller sits closer to the line, larger moves further away from it. These are the driving model's
        own distances, not a measured gap between tire and paint.
      min: 1.2
      max: 1.8
      step: 0.05
      unit: meters
      enablement:
      - type: param
        key: LaneCenteringSingleLine
        equals: true
    - key: LaneCenteringSingleLineLaneDist
      widget: option
      title: One-Line Mode, Distance From a Center or Lane Line
      description: How far One-Line Mode keeps the car from a visible center line or line between lanes. 1.5 is the car's normal
        position in a lane. Smaller sits closer to the line, larger moves further away from it. When it cannot tell which kind
        of line it is, the smaller of the two distances is used.
      min: 1.2
      max: 1.8
      step: 0.05
      unit: meters
      enablement:
      - type: param
        key: LaneCenteringSingleLine
        equals: true
    - key: LaneCenteringDisplay
      widget: toggle
      title: Show Correction On Screen
      description: Draws a small bar while driving showing which way lane centering is nudging the car and how hard. The
        bar fills to the side the car is being pulled, stays dim while the car is already close enough to the middle, and
        turns gray when the lane lines cannot be trusted. While One-Line Mode is keeping the car clear of a single
        line the bar turns light blue, a mark at its end shows which side that line is on, and the screen says "one
        line".
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
- id: blinker
  title: Blinker Control
  description: Lateral pause behavior during turn signals
  items:
  - key: BlinkerPauseLateralControl
    widget: toggle
    title: Pause Lateral Control with Blinker
    description: Pause lateral control with blinker when traveling below the desired speed selected.
    sub_items:
    - key: BlinkerMinLateralControlSpeed
      widget: option
      title: Minimum Speed to Pause Lateral Control
      min: 0
      max: 255
      step: 5
      unit:
        metric: km/h
        imperial: mph
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
    - key: BlinkerLateralReengageDelay
      widget: option
      title: Post-Blinker Delay
      description: Delay before lateral control resumes after the turn signal ends.
      min: 0
      max: 10
      step: 1
      unit: second
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
- id: torque
  title: Torque Control
  description: Steering torque tuning and lateral control method
  enablement:
  - type: capability
    field: torque_allowed
    equals: true
  items:
  - key: EnforceTorqueControl
    widget: toggle
    title: Enforce Torque Lateral Control
    description: Enable this to enforce sunnypilot to steer with Torque lateral control.
    visibility:
    - type: not
      condition:
        type: capability
        field: steer_control_type
        equals: angle
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: torque_allowed
      equals: true
    - type: param
      key: NeuralNetworkLateralControl
      equals: false
  sub_panels:
  - id: torque_settings
    label: Torque Settings
    trigger_key: EnforceTorqueControl
    trigger_condition:
      type: param
      key: EnforceTorqueControl
      equals: true
    items:
    - key: LateralJerkTorqueController
      widget: toggle
      title: Lateral Jerk Torque Controller
      description: Looks ahead at planned steering to reduce sudden corrections, so the wheel moves more smoothly through turns. Works with Self-Tune and custom tuning. Thanks to @twilsonco for the implementation.
      visibility:
      - type: not
        condition:
          type: capability
          field: steer_control_type
          equals: angle
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: NeuralNetworkLateralControl
        equals: false
    - key: LiveTorqueParamsToggle
      widget: toggle
      title: Self-Tune
      description: Enables self-tune for Torque lateral control for platforms that do not use Torque lateral control by default.
      enablement:
      - $ref: '#/macros/offroad'
    - key: LiveTorqueParamsRelaxedToggle
      widget: toggle
      title: Less Restrict Settings for Self-Tune (Beta)
      description: Less strict settings when using Self-Tune. This allows torqued to be more forgiving when learning values.
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: LiveTorqueParamsToggle
        equals: true
    - key: CustomTorqueParams
      widget: toggle
      title: Enable Custom Tuning
      description: Enables custom tuning for Torque lateral control. Modifying Lateral Acceleration Factor and Friction below
        will override the offline values indicated in the YAML files within "opendbc/car/torque_data". The values will also
        be used live when "Manual Real-Time Tuning" toggle is enabled.
      enablement:
      - $ref: '#/macros/offroad'
    - key: TorqueParamsOverrideEnabled
      widget: toggle
      title: Manual Real-Time Tuning
      description: Enforces the torque lateral controller to use the fixed values instead of the learned values from Self-Tune.
        Enabling this toggle overrides Self-Tune values.
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: CustomTorqueParams
        equals: true
    - key: TorqueParamsOverrideLatAccelFactor
      widget: option
      title: Lateral Acceleration Factor
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.1
      max: 5.0
      step: 0.1
      unit: m/s²
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueParamsOverrideFriction
      widget: option
      title: Friction
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.0
      max: 1.0
      step: 0.01
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueControlTune
      widget: multiple_button
      title: Torque Control Tune Version
      description: Select the version of Torque Control Tune to use.
      options:
      - value: ''
        label: Default
      - value: 1.0
        label: v1.0
      - value: 0.0
        label: v0.0
      enablement:
      - $ref: '#/macros/offroad'
- id: lane_change
  title: Lane Change
  description: Automatic lane change timing and behavior
  items:
  - key: AutoLaneChangeTimer
    widget: option
    title: Auto Lane Change by Blinker
    description: |-
      Set a timer to delay the auto lane change operation when the blinker is used. No nudge on the steering wheel is required to auto lane change if a timer is set. Default is Nudge.
    details: |-
      Please use caution when using this feature. Only use the blinker when traffic and road conditions permit.
    options:
    - value: -1
      label: 'Off'
    - value: 0
      label: Nudge
    - value: 1
      label: Nudgeless
    - value: 2
      label: 0.5 second
    - value: 3
      label: 1 second
    - value: 4
      label: 2 seconds
    - value: 5
      label: 3 seconds
  - key: RoadEdgeLaneChangeEnabled
    widget: toggle
    title: 'Block Lane Change: Road Edge Detection'
    description: Blocks lane change when the model sees a road edge on the side you signal.
  - key: AutoLaneChangeBsmDelay
    widget: toggle
    title: 'Auto Lane Change: Delay with Blind Spot'
    description: Toggle to enable a delay timer for lane changes when blind spot monitoring (BSM) detects a vehicle in your blind
      spot.
    enablement:
    - type: capability
      field: has_bsm
      equals: true
    - type: param_compare
      key: AutoLaneChangeTimer
      op: '>'
      value: 0
# FM Pilot sections (fm-dev-sync), after sunnypilot's own, in the order of the build plan. Each feature PR fills its own.
- id: fm_torque
  title: FM Custom Torque Settings
  description: FM Pilot - how much steering torque openpilot may use on the Rivian and how it backs off when you steer
  items:
  - key: FM_CustomMaxTorque
    widget: option
    title: Max Torque
    description: '385 = stock AP. The most steering torque openpilot may use under about 20 mph, tapering back to the
      usual limits by about 38 mph; highway limits are unchanged. The panda''s limit follows this number. Above 385
      openpilot also lets torque build faster under 25 mph and uses the full limit past 90° of steering wheel, and it
      only reaches for the extra torque when the usual limit runs out. Overriding takes a firmer hand as the number
      rises: under about 22 mph your steering fully cancels openpilot''s torque at about 2.9 Nm at 385, 3.4 Nm at 475 and
      3.9 Nm at 580 (the driver-torque rule is unchanged; it scales with the limit). Only changes in off-road mode and
      applies from the next drive.'
    min: 385
    max: 580
    step: 15
    needs_onroad_cycle: true
    enablement:
    - $ref: '#/macros/offroad'
    - {type: capability, field: brand, equals: rivian}
  - key: FM_ReleaseGuardLimit
    widget: multiple_button
    title: Release Guard
    description: 'When you hold the wheel tighter than openpilot wants in a slow turn, openpilot''s correction pushes
      back against your hands, and that push is still there when you let go, so the wheel can swing past center.
      Release Guard limits that push against you while you steer into the turn under 15 mph (fading out by 20 mph),
      and fades out over 0.5 s after you let go. Stock = off. 150 = at most 150 counts against you, 75 = at most 75.
      Never touches feedforward or any torque limit; off with Lateral Jerk or NNLC.'
    options:
    - value: 0
      label: Stock
    - value: 75
      label: '75'
    - value: 150
      label: '150'
    enablement:
    - {type: capability, field: brand, equals: rivian}
- id: fm_feedforward
  title: Feedforward Settings
  description: FM Pilot - extra steering torque for the wheel angle a slow turn needs, per side
  items:
  - key: FM_LowSpeedFFLeft
    widget: multiple_button
    title: Low-Speed Feedforward, Left Turns
    description: 'Under about 10 mph openpilot''s feedforward asks for almost nothing even in a tight turn, so the
      correction supplies all the torque, late. This adds torque for the wheel angle the turn needs, full under 10 mph
      and gone by 16 mph. Gentle 40 %, Medium 60 %, Firm 80 %, Full 100 % of a table fitted on your Nov 11 drives (Full
      never adds more than the gap measured). Off = stock. Not with Lateral Jerk or NNLC.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Gentle
    - value: 2
      label: Medium
    - value: 3
      label: Firm
    - value: 4
      label: Full
    enablement:
    - {type: capability, field: brand, equals: rivian}
    - type: not
      condition: {type: param, key: LateralJerkTorqueController, equals: true}
    - type: not
      condition: {type: param, key: NeuralNetworkLateralControl, equals: true}
  - key: FM_LowSpeedFFRight
    widget: multiple_button
    title: Low-Speed Feedforward, Right Turns
    description: Same as left turns, for right turns. Off on both sides is the feature off.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Gentle
    - value: 2
      label: Medium
    - value: 3
      label: Firm
    - value: 4
      label: Full
    enablement:
    - {type: capability, field: brand, equals: rivian}
    - type: not
      condition: {type: param, key: LateralJerkTorqueController, equals: true}
    - type: not
      condition: {type: param, key: NeuralNetworkLateralControl, equals: true}
- id: fm_smoothing
  title: FM Smoothing Settings
  description: FM Pilot - calmer steering at low speed and when turns start
  items:
  - key: FM_TurnPhaseIn
    widget: toggle
    title: Smooth Turn Start
    description: 'Whatever Turn Lead and Turn Hold add on top of the model eases in over about a third of a second
      instead of arriving all at once, so the steering doesn''t grab and then swing back. It still lets go at once, so
      handing back to the model isn''t delayed. The model''s own steering is never slowed.'
    enablement:
    - type: any
      conditions:
      - {type: param, key: FM_TurnHoldEnabled, equals: true}
      - {type: param, key: FM_TurnLeadEnabled, equals: true}
  - key: FM_LowSpeedCorrectionStrength
    widget: option
    title: Low-Speed Correction Strength
    description: 'How much of openpilot''s low-speed steering correction is kept below about 16 mph (back to normal by
      20 mph; highway unchanged). 100 % = stock; lower is calmer: less push to the limit and back mid-turn, but also
      less torque early in a turn.'
    min: 40
    max: 100
    step: 5
    unit: '%'
    enablement:
    - {type: capability, field: brand, equals: rivian}
  - key: FM_LowSpeedCurvatureFloor
    widget: toggle
    title: Calmer Crawl-Speed Steering
    description: 'Reduces steering requests from action-head models below 5.6 mph. This can calm twitchy steering
      near a stop and soften the start of tight turns. Off uses the stock floor.'
  - key: FM_StraightPullAwayFloor
    widget: toggle
    title: Calmer Straight Pull-Away
    description: 'Reduces steering requests from action-head models when pulling away straight below 5.6 mph.
      A turn signal, turn request, or sustained steering input brings back the usual steering over half a second.
      Calmer Crawl-Speed Steering already applies this reduction whenever you are crawling.'
- id: fm_model_smoothing
  title: Model Lateral Smoothing
  description: FM Pilot - how much the model's steering request is smoothed, for small and big models
  items:
  - key: FM_SmallModelSmoothingMode
    widget: multiple_button
    title: Small Models
    description: 'Model Default uses the model bundle. Higher smoothing makes steering calmer and reads slightly
      farther ahead in the model plan, so it can steer a little earlier.'
    options:
    - {value: 0, label: Model Default}
    - {value: 1, label: '0.00 s'}
    - {value: 2, label: '0.10 s'}
  - key: FM_BigModelSmoothingMode
    widget: multiple_button
    title: Big Models
    description: 'Model Default uses the model’s own behavior. 0.10 s smooths the steering request and can make
      it respond about 0.1 s later. Prediction timing stays the same.'
    options:
    - {value: 0, label: Model Default}
    - {value: 1, label: '0.00 s'}
    - {value: 2, label: '0.10 s'}
- id: fm_turns
  title: Turns
  description: FM Pilot - help through slow blinker turns, before and after them
  items:
  - key: FM_TurnHoldEnabled
    widget: toggle
    title: Turn Hold
    description: 'During a blinker turn under 20 mph, keeps the model from letting go of the turn halfway. Holds the
      steering request near the turn''s strongest point, easing off gradually, until the truck has turned about 75
      degrees, the blinker is cancelled, or you steer against the turn. Built in: its 8 seconds only count once the
      truck is turning; a brief or light press against the turn (under a quarter second and 1.5 Nm, or under 1.5
      seconds before the truck has turned 10 degrees, or straightening at the start of a turn under 5 mph) passes
      through without ending it; it ignores the wheel while openpilot isn''t steering; below 5 mph it only holds a
      request the model kept up for 0.3 seconds; and a deliberate nudge into the turn at 2 to 8 mph adds a little
      extra steering when the path just ahead already bends that way.'
  - key: FM_TurnLeadEnabled
    widget: toggle
    title: Turn Lead
    description: During a blinker turn from Turn Lead Min Speed up to about 16 mph, start turning on time when the model
      turns in late. Reads the curve of the planned path just ahead and asks for it until the truck catches up, then hands
      back to the model. Never asks for a tighter turn than Turn Path Tightest Radius. Works with Turn Hold (which then
      holds what Turn Lead asked for), but using one at a time makes each turn easier to judge. From StarPilot's Model
      Turn Assist.
  - key: FM_TurnCarryThrough
    widget: toggle
    title: Finish Turn After Signal Cancels
    description: If the blinker goes off (or cancels itself) early in a turn while the truck is still turning, Turn Lead
      and Turn Hold keep helping until the truck straightens out, for up to 6 seconds, instead of dropping back to the
      model at once. Ends right away if you steer against the turn, openpilot stops steering or you reach 20 mph. If the
      blinker goes off after the truck has turned 45 degrees, or once it is already straightening out, the turn is ending,
      so Turn Assist lets go over half a second as usual. The model, the Turning alert and lane changes still follow the
      blinker.
    enablement:
    - type: any
      conditions:
      - {type: param, key: FM_TurnHoldEnabled, equals: true}
      - {type: param, key: FM_TurnLeadEnabled, equals: true}
  sub_panels:
  - id: turn_hold_settings
    label: Turn Hold Settings
    trigger_key: FM_TurnHoldEnabled
    trigger_condition:
      type: param
      key: FM_TurnHoldEnabled
      equals: true
    items:
    - key: FM_TurnHoldPathSource
      widget: toggle
      title: Hold Path Source
      description: When starting a turn from a stop or a crawl (under about 2 mph), also take the turn from the planned
        path, so the truck turns even if the model's steering request still says straight. Never tighter than Turn Path
        Tightest Radius (12 m unless changed on Turn Lead Settings). From StarPilot's Model Turn Assist.
      enablement:
      - {type: param, key: FM_TurnHoldEnabled, equals: true}
    - key: FM_TurnHoldDriverAdds
      widget: toggle
      title: Hold Adds Your Steering
      description: When you steer into the turn, Turn Hold keeps the curve you gave it, up to full lock, instead of
        letting go and instead of pushing back toward a wider turn, so the help stays once you let go of the wheel.
        Steering into the turn never releases it, even before the truck starts turning; steering against the turn still
        releases it. From StarPilot's Model Turn Assist.
      enablement:
      - {type: param, key: FM_TurnHoldEnabled, equals: true}
    - key: FM_TurnHoldFollowExit
      widget: toggle
      title: Hold Follows the Model's Exit
      description: Once the truck has turned 45 degrees, when the model starts letting go of the turn (asking for less
        than half of the hold's tightest), Turn Hold fades out over half a second so the truck straightens out with the
        model, instead of holding the turn until 75 degrees. While you press the wheel into the turn it waits until you
        ease off.
      enablement:
      - {type: param, key: FM_TurnHoldEnabled, equals: true}
    - key: FM_TurnRestartAfterStop
      widget: toggle
      title: Stop Before Turning Starts Over
      description: If the truck stops before it has turned 10 degrees (waiting in a line, creeping up to the stop line),
        the turn starts over when you pull away. Nothing from the creep carries into the real turn - not Turn Hold's
        remembered curve, not a hold you released, not Turn Lead paused or switched off by your hands. A turn you pause
        partway through (past 10 degrees) keeps everything.
      enablement:
      - {type: param, key: FM_TurnHoldEnabled, equals: true}
  - id: turn_lead_settings
    label: Turn Lead Settings
    trigger_key: FM_TurnLeadEnabled
    trigger_condition:
      type: param
      key: FM_TurnLeadEnabled
      equals: true
    items:
    - key: FM_TurnLeadMinSpeed
      widget: option
      title: Turn Lead Min Speed
      description: Lowest speed Turn Lead works at; it reaches full strength about 2 mph above this. Lower it to help
        turns that start late when pulling away from a stop. 7 mph is about StarPilot's fixed value and the default.
        Below 2 mph, Turn Hold's Hold Path Source covers turns from a stop.
      min: 2
      max: 7
      step: 1
      unit: mph
      enablement:
      - {type: param, key: FM_TurnLeadEnabled, equals: true}
    - key: FM_TurnLeadAdaptive
      widget: toggle
      title: Adaptive Look-Ahead
      description: Reads the path only as far ahead as the steering actually lags, 0.5 s for a gentle curve up to 0.9 s
        for a tight turn, instead of a fixed 1.3 s, so the turn doesn't start several meters before the corner. Off is
        the fixed 1.3 s.
      enablement:
      - {type: param, key: FM_TurnLeadEnabled, equals: true}
    - key: FM_TurnLeadGate
      widget: toggle
      title: Wait for the Corner
      description: Turn Lead only starts once the corner is close, within Turn Lead Start Distance, instead of as soon
        as the planned path shows a turn somewhere ahead. Stops it from turning toward the curb before you reach the
        corner.
      enablement:
      - {type: param, key: FM_TurnLeadEnabled, equals: true}
    - key: FM_TurnLeadGateDist
      widget: option
      title: Turn Lead Start Distance
      description: With Wait for the Corner, how close the corner has to be (where the planned path has turned 10
        degrees, a couple of meters into it) before Turn Lead acts. Smaller starts later. Default 5 m, about 2 to 3 m
        before the corner.
      min: 3
      max: 10
      step: 1
      unit: m
      enablement:
      - {type: param, key: FM_TurnLeadEnabled, equals: true}
      - {type: param, key: FM_TurnLeadGate, equals: true}
    - key: FM_TurnLeadYield
      widget: toggle
      title: Turn Lead Yields to Your Hands
      description: If you hold the wheel against the turn while Turn Lead is adding steering (a quarter second, or
        firmly), Turn Lead backs off. Before the truck has turned 10 degrees it only pauses and comes back half a second
        after you let go; once the truck is turning, it stays off for the rest of that turn. Pressing before Turn Lead
        starts changes nothing.
      enablement:
      - {type: param, key: FM_TurnLeadEnabled, equals: true}
    - key: FM_TurnPathMinRadius
      widget: option
      title: Turn Path Tightest Radius
      description: The tightest turn Turn Lead may ask for on its own, as a radius. Hold Path Source (Turn Hold
        Settings) and Turn Hold's built-in nudge share this setting. Smaller is stronger; 8 m is the strongest. Default
        12 m. Your own steering (Hold Adds Your Steering) isn't limited by it.
      min: 8
      max: 20
      step: 1
      unit: m
      enablement:
      - type: any
        conditions:
        - {type: param, key: FM_TurnLeadEnabled, equals: true}
        - {type: param, key: FM_TurnHoldPathSource, equals: true}
  - id: pre_post_turn
    label: Pre/Post Turn Behavior
    trigger_key: FM_TurnQueueGuard
    items:
    - key: FM_TurnQueueGuard
      widget: toggle
      title: Queue Guard
      description: Waiting in a line of cars with the blinker on, the turn normally starts right away, so every creep
        forward steers toward the turn. With this on, once you are stopped with a car within 8 m ahead, the turn waits
        (no steering toward it, and the Turning alert goes away) until that car is more than 10 m ahead or gone, or you
        reach 10 mph; then the turn starts fresh. A turn the truck has already started (10 degrees or more) is never
        held, and a wait is never taken for the blinker cancelling (Finish Turn After Signal Cancels doesn't carry it).
    - key: FM_TurnPulseOnPullAway
      widget: toggle
      title: Turn Pulse on Pull-Away
      description: The model only hears a turn for about 5 seconds after it starts, so after a long wait at a corner it
        has forgotten the turn and turns in late. With this on, when you pull away from a stop with a turn still on, the
        model is told about the turn again. Only the model's input changes; the turn, its alert and Turn Assist are the
        same.
    - key: FM_TurnSettle
      widget: toggle
      title: Settle After Turn
      description: For up to 6 seconds after a blinker turn, between 8 and 30 mph, gently steers toward the middle of the
        lane using lane lines the model is only 30% sure of, before Blendful or lane centering trust them. After a left
        turn it only moves away from the center line, never toward it. Road edges only keep it from aiming too close to
        the curb. It lets go as soon as Blendful takes over, you steer, a new blinker or lane change starts, or you pass
        30 mph. When Finish Turn After Signal Cancels carries a turn on, it waits until that carry ends.
    - key: FM_TurnSettleEarlyPush
      widget: toggle
      title: 'Settle After Turn: Early Right Push'
      description: Needs Settle After Turn. Starts as soon as the truck straightens out of the turn (not only when the
        blinker goes off), from 3 mph. If no lane line can be seen yet, it eases the truck to the right, at most 0.4 m
        (about 16 inches), after left and right turns alike, because oncoming traffic is always on the left. It stops
        when a line shows you are centered or right of center (then it centers as Settle After Turn does), 1.4 m from a
        sure curb (and steers back left if the path gets too close to it), and holds when the model steers left around
        something such as a parked car. Your steering cancels it at once. Gentle at low speed. The 3 mph, 0.4 m and
        strength values are provisional, not yet checked on a recorded drive.
      enablement:
      - {type: param, key: FM_TurnSettle, equals: true}
