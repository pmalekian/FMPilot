# Page: steering
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: steering
label: Steering
icon: steering_wheel
order: 1
remote_configurable: true
description: Lateral control, lane changes, and steering behavior
sections:
- id: mads
  title: Modular Assistive Driving System (MADS)
  description: ''
  items:
  - key: Mads
    widget: toggle
    title: Enable Modular Assistive Driving System (MADS)
    description: Enable MADS. Disable toggle to revert back to stock sunnypilot engagement/disengagement.
    enablement:
    - $ref: '#/macros/offroad'
  sub_panels:
  - id: mads_settings
    label: MADS Settings
    trigger_key: Mads
    trigger_condition:
      type: param
      key: Mads
      equals: true
    items:
    - key: RivianEnhancedMads
      widget: toggle
      title: Use enhanced Rivian MADS
      description: 'Adds to MADS on Rivian: one click up on the stalk turns steering assist on or off, every brake mode
        can be chosen, shifting into Park or Reverse or a full stalk pull switches MADS off, and a minimum speed to engage
        can be set. When off, MADS works as in stock sunnypilot: the brake turns steering assist off and it comes back
        with cruise.'
      needs_onroad_cycle: true
      enablement:
      - $ref: '#/macros/offroad'
      - {type: capability, field: brand, equals: rivian}
    - key: MadsMainCruiseAllowed
      widget: toggle
      title: Toggle with Main Cruise
      description: 'Note: For vehicles without LFA/LKAS button, disabling this will prevent lateral control engagement.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsUnifiedEngagementMode
      widget: toggle
      title: Unified Engagement Mode (UEM)
      description: 'Engage lateral and longitudinal control with cruise control engagement. Note: Once lateral control is
        engaged via UEM, it will remain engaged until it is manually disabled via the MADS button or car shut off.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsSteeringMode
      widget: multiple_button
      title: Steering Mode on Brake Pedal
      description: Choose how Automatic Lane Centering (ALC) behaves after the brake pedal is manually pressed in sunnypilot.
      options:
      - value: 0
        label: Remain Active
        enablement:
        - $ref: '#/macros/mads_steering_full_platforms'
      - value: 1
        label: Pause
        enablement:
        - $ref: '#/macros/mads_steering_full_platforms'
      - value: 2
        label: Disengage
      enablement:
      - $ref: '#/macros/offroad'
    - key: MadsMinEngageSpeed
      widget: option
      title: Minimum Speed to Engage MADS
      description: Minimum vehicle speed required to (re-)engage MADS lateral control. In Pause mode this also applies
        to resuming after the brake is released, so steering assist comes back once the car reaches this speed. 0 = no
        minimum.
      min: 0
      max: 20
      step: 1
      unit:
        metric: km/h
        imperial: mph
      needs_onroad_cycle: true
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/rivian_enhanced_mads'
- id: lane_centering
  title: Lane Centering
  description: Keep the car in its lane. One of Lane Centering, Lane Guard or Blendful (FM Pilot)
  items:
  - key: FM_LaneKeepMode
    widget: option
    title: Lane Centering
    description: 'FM Pilot - pick one way of keeping the car in its lane, or Off for the driving model alone. Lane
      Centering (AdventurePilot): keeps the car in the middle of the painted lane instead of wherever the driving model
      chooses to sit; only acts when both lane lines are clearly visible (unless One-Line Mode is on), and steps aside for
      lane changes and turn signals. Lane Guard: a gentle correction only when the planned path brings the body too close
      to a lane line or road edge; pauses while you steer or signal (from gerrylum''s rx-wb). Blendful (alpha): a gentle
      nudge toward the lane center on top of the model''s own steering, stronger when the lane lines are clear; yields
      around obstacles, works down to about 1 mph (0.3 m/s), off during turns and lane changes; draws its blue center
      line. Needs a custom (non-Default) model (from sunnypilot).'
    details: |-
      Lane Centering's corrections are deliberately small and are smoothed in over about half a second, so this should
      read as the car sitting straighter rather than as active steering. Whenever the lane lines become unreliable, a
      lane change starts or a turn signal comes on, the correction fades away rather than being dropped in one go.
      Only one of the three can be on at a time.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Lane Centering
    - value: 2
      label: Lane Guard
    - value: 3
      label: Blendful
  sub_panels:
  - id: lane_centering_settings
    label: Lane Centering Settings
    trigger_key: FM_LaneKeepMode
    trigger_condition:
      type: param
      key: FM_LaneKeepMode
      equals: 1
    items:
    - key: LaneCenteringOffset
      widget: option
      title: Position in Lane
      description: Sit deliberately off the middle of the lane. Positive values sit to the right, negative to the left.
        The car is never aimed closer than 1.1 m/3.6 ft to either line, so a large offset in a narrow lane is trimmed back.
      min: -0.3
      max: 0.3
      step: 0.01
      unit: meters
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    # Permanent. What suits one car, model and road does not suit the next, and comparing values needs
    # them changeable between legs of a single drive rather than a rebuild per value.
    - key: LaneCenteringGain
      widget: option
      title: Centering Strength
      description: Sets how hard the car is pulled back toward the middle of the lane. Higher means it sits closer to the
        middle but works harder to get there. 0.6 suits the cars and roads tested so far. Lower feels smoother than it really
        is, and 0.3 is too weak to hold against a road crown, leaving the car sitting off center all day.
      min: 0.0
      max: 1.0
      step: 0.1
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    # Permanent, same reason as the strength above.
    - key: LaneCenteringDeadband
      widget: option
      title: Close Enough To Center
      description: How far off the middle of the lane the car is allowed to sit before lane centering does anything about
        it. Smaller sits closer to the middle. It does not make the car calmer. A wide tolerance lets the car drift to the
        edge and get kicked back, which reverses more often, not less. Road testing settled on 0.02. The car's own screen
        shows this in cm/in.
      min: 0.0
      max: 0.15
      step: 0.01
      unit: meters
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    - key: LaneCenteringE2EAuthority
      widget: option
      title: Let the Model Sit Off Center
      description: How much freedom the driving model keeps to sit well off the middle of the lane when it is sure of itself,
        which usually means it is avoiding something. 1.0 always lets it have its way, 0 centers the car regardless. This
        only applies to large departures; small ones are always corrected.
      min: 0.0
      max: 1.0
      step: 0.1
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    - key: LaneCenteringSingleLine
      widget: toggle
      title: One-Line Mode
      description: When only one lane line is clearly visible, such as on an on-ramp with a faded edge line or a town street
        with a center line and a bare curb, keep the car from sitting too close to that line. It only ever moves the car away
        from the visible line, never past the middle of the lane, and not at all when it cannot see anything on the other side.
      details: |-
        Experimental. It never aims at a lane middle it cannot see. Anything the driving model is unsure of on the far side,
        such as a faint line or the edge of the tarmac, can only make the move smaller. It does not follow a line that
        bends away from the car's path, such as the line at a highway exit. Position in Lane and Let the Model Sit Off Center
        do not apply in this mode.
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
    - key: LaneCenteringSingleLineEdgeDist
      widget: option
      title: One-Line Mode, Distance From an Edge Line
      description: How far One-Line Mode keeps the car from a visible line at the edge of the road. 1.5 is the car's normal
        position in a lane. Smaller sits closer to the line, larger moves further away from it. These are the driving model's
        own distances, not a measured gap between tire and paint.
      min: 1.2
      max: 1.8
      step: 0.05
      unit: meters
      enablement:
      - type: param
        key: LaneCenteringSingleLine
        equals: true
    - key: LaneCenteringSingleLineLaneDist
      widget: option
      title: One-Line Mode, Distance From a Center or Lane Line
      description: How far One-Line Mode keeps the car from a visible center line or line between lanes. 1.5 is the car's normal
        position in a lane. Smaller sits closer to the line, larger moves further away from it. When it cannot tell which kind
        of line it is, the smaller of the two distances is used.
      min: 1.2
      max: 1.8
      step: 0.05
      unit: meters
      enablement:
      - type: param
        key: LaneCenteringSingleLine
        equals: true
    - key: LaneCenteringDisplay
      widget: toggle
      title: Show Correction On Screen
      description: Draws a small bar while driving showing which way lane centering is nudging the car and how hard. The
        bar fills to the side the car is being pulled, stays dim while the car is already close enough to the middle, and
        turns gray when the lane lines cannot be trusted. While One-Line Mode is keeping the car clear of a single
        line the bar turns light blue, a mark at its end shows which side that line is on, and the screen says "one
        line".
      enablement:
      - type: param
        key: FM_LaneKeepMode
        equals: 1
- id: blinker
  title: Blinker Control
  description: Lateral pause behavior during turn signals
  items:
  - key: BlinkerPauseLateralControl
    widget: toggle
    title: Pause Lateral Control with Blinker
    description: Pause lateral control with blinker when traveling below the desired speed selected.
    sub_items:
    - key: BlinkerMinLateralControlSpeed
      widget: option
      title: Minimum Speed to Pause Lateral Control
      min: 0
      max: 255
      step: 5
      unit:
        metric: km/h
        imperial: mph
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
    - key: BlinkerLateralReengageDelay
      widget: option
      title: Post-Blinker Delay
      description: Delay before lateral control resumes after the turn signal ends.
      min: 0
      max: 10
      step: 1
      unit: second
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
- id: torque
  title: Torque Control
  description: Steering torque tuning and lateral control method
  enablement:
  - type: capability
    field: torque_allowed
    equals: true
  items:
  - key: EnforceTorqueControl
    widget: toggle
    title: Enforce Torque Lateral Control
    description: Enable this to enforce sunnypilot to steer with Torque lateral control.
    visibility:
    - type: not
      condition:
        type: capability
        field: steer_control_type
        equals: angle
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: torque_allowed
      equals: true
    - type: param
      key: NeuralNetworkLateralControl
      equals: false
  sub_panels:
  - id: torque_settings
    label: Torque Settings
    trigger_key: EnforceTorqueControl
    trigger_condition:
      type: param
      key: EnforceTorqueControl
      equals: true
    items:
    - key: LateralJerkTorqueController
      widget: toggle
      title: Lateral Jerk Torque Controller
      description: Looks ahead at planned steering to reduce sudden corrections, so the wheel moves more smoothly through turns. Works with Self-Tune and custom tuning. Thanks to @twilsonco for the implementation.
      visibility:
      - type: not
        condition:
          type: capability
          field: steer_control_type
          equals: angle
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: NeuralNetworkLateralControl
        equals: false
    - key: LiveTorqueParamsToggle
      widget: toggle
      title: Self-Tune
      description: Enables self-tune for Torque lateral control for platforms that do not use Torque lateral control by default.
      enablement:
      - $ref: '#/macros/offroad'
    - key: LiveTorqueParamsRelaxedToggle
      widget: toggle
      title: Less Restrict Settings for Self-Tune (Beta)
      description: Less strict settings when using Self-Tune. This allows torqued to be more forgiving when learning values.
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: LiveTorqueParamsToggle
        equals: true
    - key: CustomTorqueParams
      widget: toggle
      title: Enable Custom Tuning
      description: Enables custom tuning for Torque lateral control. Modifying Lateral Acceleration Factor and Friction below
        will override the offline values indicated in the YAML files within "opendbc/car/torque_data". The values will also
        be used live when "Manual Real-Time Tuning" toggle is enabled.
      enablement:
      - $ref: '#/macros/offroad'
    - key: TorqueParamsOverrideEnabled
      widget: toggle
      title: Manual Real-Time Tuning
      description: Enforces the torque lateral controller to use the fixed values instead of the learned values from Self-Tune.
        Enabling this toggle overrides Self-Tune values.
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: CustomTorqueParams
        equals: true
    - key: TorqueParamsOverrideLatAccelFactor
      widget: option
      title: Lateral Acceleration Factor
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.1
      max: 5.0
      step: 0.1
      unit: m/s²
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueParamsOverrideFriction
      widget: option
      title: Friction
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.0
      max: 1.0
      step: 0.01
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueControlTune
      widget: multiple_button
      title: Torque Control Tune Version
      description: Select the version of Torque Control Tune to use.
      options:
      - value: ''
        label: Default
      - value: 1.0
        label: v1.0
      - value: 0.0
        label: v0.0
      enablement:
      - $ref: '#/macros/offroad'
- id: lane_change
  title: Lane Change
  description: Automatic lane change timing and behavior
  items:
  - key: AutoLaneChangeTimer
    widget: option
    title: Auto Lane Change by Blinker
    description: |-
      Set a timer to delay the auto lane change operation when the blinker is used. No nudge on the steering wheel is required to auto lane change if a timer is set. Default is Nudge.
    details: |-
      Please use caution when using this feature. Only use the blinker when traffic and road conditions permit.
    options:
    - value: -1
      label: 'Off'
    - value: 0
      label: Nudge
    - value: 1
      label: Nudgeless
    - value: 2
      label: 0.5 second
    - value: 3
      label: 1 second
    - value: 4
      label: 2 seconds
    - value: 5
      label: 3 seconds
  - key: RoadEdgeLaneChangeEnabled
    widget: toggle
    title: 'Block Lane Change: Road Edge Detection'
    description: Blocks lane change when the model sees a road edge on the side you signal.
  - key: AutoLaneChangeBsmDelay
    widget: toggle
    title: 'Auto Lane Change: Delay with Blind Spot'
    description: Toggle to enable a delay timer for lane changes when blind spot monitoring (BSM) detects a vehicle in your blind
      spot.
    enablement:
    - type: capability
      field: has_bsm
      equals: true
    - type: param_compare
      key: AutoLaneChangeTimer
      op: '>'
      value: 0
# FM Pilot sections (fm-dev-sync), after sunnypilot's own, in the order of the build plan. Each feature PR fills its own.
- id: fm_torque
  title: FM Custom Torque Settings
  description: FM Pilot - how much steering torque openpilot may use on the Rivian and how it backs off when you steer
  items:
  - key: FM_CustomMaxTorque
    widget: option
    title: Max Torque
    description: '385 = stock AP. The most steering torque openpilot may use under about 20 mph, tapering back to the
      usual limits by about 38 mph; highway limits are unchanged. The panda''s limit follows this number. Above 385
      openpilot also lets torque build faster under 25 mph and uses the full limit past 90° of steering wheel, and it
      only reaches for the extra torque when the usual limit runs out. Overriding takes a firmer hand as the number
      rises: under about 22 mph your steering fully cancels openpilot''s torque at about 2.9 Nm at 385, 3.4 Nm at 475 and
      3.9 Nm at 580 (the driver-torque rule is unchanged; it scales with the limit). Only changes in off-road mode and
      applies from the next drive.'
    min: 385
    max: 580
    step: 15
    needs_onroad_cycle: true
    enablement:
    - $ref: '#/macros/offroad'
    - {type: capability, field: brand, equals: rivian}
  - key: FM_ReleaseGuardLimit
    widget: multiple_button
    title: Release Guard
    description: 'When you hold the wheel tighter than openpilot wants in a slow turn, openpilot''s correction pushes
      back against your hands, and that push is still there when you let go, so the wheel can swing past center.
      Release Guard limits that push against you while you steer into the turn under 15 mph (fading out by 20 mph),
      and fades out over 0.5 s after you let go. Stock = off. 150 = at most 150 counts against you, 75 = at most 75.
      Never touches feedforward or any torque limit; off with Lateral Jerk or NNLC.'
    options:
    - value: 0
      label: Stock
    - value: 75
      label: '75'
    - value: 150
      label: '150'
    enablement:
    - {type: capability, field: brand, equals: rivian}
- id: fm_feedforward
  title: Feedforward Settings
  description: FM Pilot - extra steering torque for the wheel angle a slow turn needs, per side
  items:
  - key: FM_LowSpeedFFLeft
    widget: multiple_button
    title: Low-Speed Feedforward, Left Turns
    description: 'Under about 10 mph openpilot''s feedforward asks for almost nothing even in a tight turn, so the
      correction supplies all the torque, late. This adds torque for the wheel angle the turn needs, full under 10 mph
      and gone by 16 mph. Gentle 40 %, Medium 60 %, Firm 80 %, Full 100 % of a table fitted on your Nov 11 drives (Full
      never adds more than the gap measured). Off = stock. Not with Lateral Jerk or NNLC.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Gentle
    - value: 2
      label: Medium
    - value: 3
      label: Firm
    - value: 4
      label: Full
    enablement:
    - {type: capability, field: brand, equals: rivian}
    - type: not
      condition: {type: param, key: LateralJerkTorqueController, equals: true}
    - type: not
      condition: {type: param, key: NeuralNetworkLateralControl, equals: true}
  - key: FM_LowSpeedFFRight
    widget: multiple_button
    title: Low-Speed Feedforward, Right Turns
    description: Same as left turns, for right turns. Off on both sides is the feature off.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Gentle
    - value: 2
      label: Medium
    - value: 3
      label: Firm
    - value: 4
      label: Full
    enablement:
    - {type: capability, field: brand, equals: rivian}
    - type: not
      condition: {type: param, key: LateralJerkTorqueController, equals: true}
    - type: not
      condition: {type: param, key: NeuralNetworkLateralControl, equals: true}
- id: fm_smoothing
  title: FM Smoothing Settings
  description: FM Pilot - calmer steering at low speed and when turns start
  items:
  - key: FM_LowSpeedCorrectionStrength
    widget: option
    title: Low-Speed Correction Strength
    description: 'How much of openpilot''s low-speed steering correction is kept below about 16 mph (back to normal by
      20 mph; highway unchanged). 100 % = stock; lower is calmer: less push to the limit and back mid-turn, but also
      less torque early in a turn.'
    min: 40
    max: 100
    step: 5
    unit: '%'
    enablement:
    - {type: capability, field: brand, equals: rivian}
  - key: FM_LowSpeedCurvatureFloor
    widget: toggle
    title: Calmer Crawl-Speed Steering
    description: 'Below 5.6 mph, ask for less steering than the model''s raw output (about 64% at 4.5 mph, 36% at 3.4 mph,
      16% at 2.2 mph), as sunnypilot and openpilot now do. Calms twitchy steering near a stop, but turns pulled out from
      a stop may start softer. Applies to all driving, not only blinker turns. Off: stock AP behavior (1.0 m/s floor).
      From sunnypilot #2091.'
  - key: FM_StraightPullAwayFloor
    widget: toggle
    title: Calmer Straight Pull-Away
    description: 'Some models (Cheddar especially) are slightly off from straight while stopped, and that is read as a
      tight curve the moment steering starts, so the wheel jerks to one side and then straightens. With this on, pulling
      away from a stop asks for much less steering below 5.6 mph (like Calmer Crawl-Speed Steering) when, at the stop,
      there was no blinker or turn and the wheel was within 30 degrees of straight. A blinker or turn during the pull-away,
      or steering it yourself for a moment, brings full steering back over half a second. Turns from a stop with the
      blinker on, and slowing to crawl speed without stopping, are unchanged. Off: stock AP behavior. Not needed with
      Calmer Crawl-Speed Steering on.'
- id: fm_model_smoothing
  title: Model Lateral Smoothing
  description: FM Pilot - how much the model's steering request is smoothed, for small and big models
  items:
  - key: FM_SmallModelLatSmoothing
    widget: multiple_button
    title: Small Models
    description: 'Replaces the small model''s built-in lateral smoothing value (often 0.00 or 0.10 s). For small models,
      this value both smooths the steering request and is added to the model''s lateral delay, so a higher value steers
      slightly earlier as well as calmer. Applies to all driving while a small model drives. Model Default = each model
      uses its own value.'
    options:
    - value: 0
      label: Model Default
    - value: 1
      label: 0.00 s
    - value: 2
      label: 0.10 s
  - key: FM_BigModelLatSmoothing
    widget: multiple_button
    title: Big Models
    description: 'Lateral smoothing for a big model (comma''s large model over Jetlink or chestnut). Unlike small models,
      this value only smooths the steering request and is not added to the model''s lateral delay, so 0.10 s calms
      straight-road wiggle and answers about 0.1 s later. Applies to all driving while a big model drives. Model Default
      = the big model''s own smoothing (raw 0.00 s). From zoompilot.'
    options:
    - value: 0
      label: Model Default
    - value: 1
      label: 0.00 s
    - value: 2
      label: 0.10 s
- id: fm_turns
  title: Turns
  description: FM Pilot - help through slow blinker turns, before and after them
