# Page: models
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: models
label: Models
icon: models
order: 10
remote_configurable: false
description: Driving model behavior and camera calibration
sections:
- id: dual_model
  title: 'FM Pilot: Dual Model Mode'
  description: One driving model steers while another handles gas and brakes
  items:
  - key: FM_DualModelEnabled
    widget: toggle
    needs_onroad_cycle: true
    title: Dual Model Mode
    description: Steer with one driving model and control speed with another. Off runs your normally selected model
      exactly like stock. Takes effect on the next onroad cycle (Offroad Mode on and off works).
  - key: FM_ShowModelLabel
    widget: toggle
    title: Show Active Models on Screen
    description: A small line showing which models are steering (L) and handling gas and brakes (G). Under the speed on
      a comma 3X, top center on a comma 4.
  sub_panels:
  - id: dual_model_settings
    label: Dual Model Settings
    trigger_key: FM_DualModelEnabled
    trigger_condition:
      type: param
      key: FM_DualModelEnabled
      equals: true
    items:
    - key: FM_LateralModelRef
      widget: multiple_button
      needs_onroad_cycle: true
      title: Steering (Lateral) Model
      description: The model that steers. Lists your downloaded favorite models; star a model in the model browser to
        add it here.
      options:
      - value: ''
        label: Same as selected model
    - key: FM_LongModelRef
      widget: multiple_button
      needs_onroad_cycle: true
      title: Gas and Brake (Longitudinal) Model
      description: The model that controls speed, following and stops. Lists your downloaded favorite models.
      options:
      - value: ''
        label: Same as selected model
    - key: FM_CurveSpeedSource
      widget: multiple_button
      needs_onroad_cycle: true
      title: Curve Speed Source
      description: Which model's view of upcoming curves Smart Cruise's curve speed control uses. Only matters with
        Curve Speed Control on.
      options:
      - value: 0
        label: Steering model
      - value: 1
        label: Gas and brake model
- id: model_behavior
  title: Model Behavior
  description: Lane desire and lead-vehicle awareness tuning
  items:
  - key: LaneTurnDesire
    widget: toggle
    title: Use Lane Turn Desires
    description: If you are driving at 20 mph (32 km/h) or below and have your blinker on, the car will plan a turn in that
      direction at the nearest drivable path. This prevents situations (like at red lights) where the car might plan the wrong
      turn direction.
  - key: LaneTurnValue
    widget: option
    title: Adjust Lane Turn Speed
    description: Set the maximum speed for lane turn desires.
    min: 0
    max: 20
    step: 1
    unit:
      metric: km/h
      imperial: mph
    enablement:
    - type: param
      key: LaneTurnDesire
      equals: true
    - $ref: '#/macros/advanced_only'
  - key: LagdToggle
    widget: toggle
    title: Live Learning Steer Delay
    description: Allow device to learn and adapt car's steering response time
  - key: LagdToggleDelay
    widget: option
    title: Adjust Software Delay
    description: Adjust the software delay when Live Learning Steer Delay is toggled off. The default software delay value
      is 0.2
    min: 0.05
    max: 0.5
    step: 0.01
    enablement:
    - type: not
      condition:
        type: param
        key: LagdToggle
        equals: true
    - $ref: '#/macros/advanced_only'
- id: lateral_control
  title: Lateral Control
  description: Neural network lateral control for supported models
  items:
  - key: NeuralNetworkLateralControl
    widget: toggle
    title: Neural Network Lateral Control (NNLC)
    description: Use a neural network for lateral control instead of the default torque controller.
    visibility:
    - type: not
      condition:
        type: capability
        field: steer_control_type
        equals: angle
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: torque_allowed
      equals: true
    - type: param
      key: EnforceTorqueControl
      equals: false
    - type: param
      key: LateralJerkTorqueController
      equals: false
- id: camera
  title: Camera
  description: Camera position and calibration
  items:
  - key: CameraOffset
    widget: option
    title: Adjust Camera Offset
    description: Virtually shift camera's perspective to move model's center to Left(+ values) or Right (- values)
    min: -0.35
    max: 0.35
    step: 0.01
    unit: meters
    enablement:
    - $ref: '#/macros/advanced_only'
